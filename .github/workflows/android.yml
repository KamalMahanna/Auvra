name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-prod-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Generate Version Info
      id: version
      run: |
        # Format date as YY.MM.DD
        DATE=$(date +'%y.%m.%d')
        # Version name is YY.MM.DD.RUN_NUMBER to make it unique and sequential
        VERSION_NAME="$DATE.${{ github.run_number }}"
        TAG_NAME="v$VERSION_NAME"
        echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
        echo "APP_VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
        echo "APP_VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV

    - name: Setup Signing Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "::error::Neither RELEASE_KEYSTORE_BASE64 nor KEYSTORE_BASE64 secret is configured in GitHub Secrets!"
          exit 1
        fi

        # Strip whitespace, newlines, and carriage returns before decoding
        echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > bitchord-release.jks

        if [ ! -s bitchord-release.jks ]; then
          echo "::error::Decoded bitchord-release.jks is 0 bytes. Check KEYSTORE_BASE64 secret."
          exit 1
        fi

        # Generate keystore.properties safely using Python to avoid shell escaping issues
        python3 - << 'EOF'
        import os
        with open("keystore.properties", "w") as f:
            f.write("storeFile=bitchord-release.jks\n")
            f.write(f"storePassword={os.environ.get('KEYSTORE_PASSWORD', '')}\n")
            f.write(f"keyAlias={os.environ.get('KEY_ALIAS', '')}\n")
            f.write(f"keyPassword={os.environ.get('KEY_PASSWORD') or os.environ.get('KEYSTORE_PASSWORD', '')}\n")
        EOF

        # Fail fast if keystore or credentials cannot be parsed
        echo "Validating keystore with keytool..."
        keytool -list -v \
          -keystore bitchord-release.jks \
          -storepass "$KEYSTORE_PASSWORD" \
          -alias "$KEY_ALIAS"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Signed Prod Release APK
      run: ./gradlew assembleProdRelease

    - name: Prepare APKs for Release
      run: |
        V="${{ steps.version.outputs.version_name }}"
        DIR="app/build/outputs/apk/prod/release"
        cp "$DIR/app-prod-universal-release.apk" "$DIR/Auvra-$V.apk"
        cp "$DIR/app-prod-universal-release.apk" "$DIR/BitChord-$V.apk"
        cp "$DIR/app-prod-arm64-v8a-release.apk" "$DIR/Auvra-${V}_arm64-v8a.apk"
        cp "$DIR/app-prod-armeabi-v7a-release.apk" "$DIR/Auvra-${V}_armeabi-v7a.apk"
        cp "$DIR/app-prod-x86_64-release.apk" "$DIR/Auvra-${V}_x86_64.apk"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Auvra-${{ steps.version.outputs.version_name }}
        path: app/build/outputs/apk/prod/release/*.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag_name }}
        name: Release ${{ steps.version.outputs.version_name }}
        files: |
          app/build/outputs/apk/prod/release/Auvra-${{ steps.version.outputs.version_name }}.apk
          app/build/outputs/apk/prod/release/BitChord-${{ steps.version.outputs.version_name }}.apk
          app/build/outputs/apk/prod/release/Auvra-${{ steps.version.outputs.version_name }}_arm64-v8a.apk
          app/build/outputs/apk/prod/release/Auvra-${{ steps.version.outputs.version_name }}_armeabi-v7a.apk
          app/build/outputs/apk/prod/release/Auvra-${{ steps.version.outputs.version_name }}_x86_64.apk
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


