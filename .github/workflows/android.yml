name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Signing Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "::error::Neither RELEASE_KEYSTORE_BASE64 nor KEYSTORE_BASE64 secret is configured in GitHub Secrets!"
          exit 1
        fi

        # Strip whitespace, newlines, and carriage returns before decoding
        echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > bitchord-release.jks

        if [ ! -s bitchord-release.jks ]; then
          echo "::error::Decoded bitchord-release.jks is 0 bytes. Check KEYSTORE_BASE64 secret."
          exit 1
        fi

        # Generate keystore.properties safely using Python to avoid shell escaping issues
        python3 - << 'EOF'
        import os
        with open("keystore.properties", "w") as f:
            f.write("storeFile=bitchord-release.jks\n")
            f.write(f"storePassword={os.environ.get('KEYSTORE_PASSWORD', '')}\n")
            f.write(f"keyAlias={os.environ.get('KEY_ALIAS', '')}\n")
            f.write(f"keyPassword={os.environ.get('KEY_PASSWORD') or os.environ.get('KEYSTORE_PASSWORD', '')}\n")
        EOF

        # Fail fast if keystore or credentials cannot be parsed
        echo "Validating keystore with keytool..."
        keytool -list -v \
          -keystore bitchord-release.jks \
          -storepass "$KEYSTORE_PASSWORD" \
          -alias "$KEY_ALIAS"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Signed Prod Release APK
      run: ./gradlew assembleProdRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-prod-release-signed
        path: app/build/outputs/apk/prod/release/*.apk


